  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--blue:#2563FF;--blue-dark:#1a4fd8;--black:#0a0a0a;--font-d:'Plus Jakarta Sans',sans-serif;--font-b:'Inter',sans-serif;}
    body{font-family:var(--font-b);background:#fff;color:var(--black);-webkit-font-smoothing:antialiased;}
    a{text-decoration:none;color:inherit;}
    
    /* --- LINK STYLES FOR BLOG CONTENT --- */
    .bd-article a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(37, 99, 255, 0.3);
      transition: all 0.25s ease;
    }
    .bd-article a:hover {
      color: var(--blue-dark);
      text-decoration-color: var(--blue);
    }
    
    .nav{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.07);z-index:100;}
    .nav-logo img{height:32px;}
    .nav-cta{background:var(--blue);color:#fff;padding:10px 22px;border-radius:100px;font-size:14px;font-weight:600;transition:all .25s;}
    .nav-cta:hover{background:var(--blue-dark);transform:translateY(-1px);}

    .bd-shell{max-width:1180px;margin:0 auto;padding:108px 40px 0;}
    .bd-crumb{display:flex;align-items:center;gap:16px;margin-bottom:30px;flex-wrap:wrap;}
    .bd-back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#555;background:#fff;border:1px solid rgba(0,0,0,.12);padding:8px 16px;border-radius:100px;transition:all .25s;}
    .bd-back:hover{border-color:var(--blue);color:var(--blue);transform:translateX(-2px);}
    .bd-back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
    .bd-bread{display:flex;align-items:center;gap:9px;font-size:13px;color:#aaa;flex-wrap:wrap;}
    .bd-bread a{color:#777;transition:color .2s;}
    .bd-bread a:hover{color:var(--blue);}
    .bd-bread .sep{color:#ccc;}
    .bd-bread .current{color:#444;font-weight:600;}

    .bd-head{max-width:860px;}
    .bd-cat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);background:rgba(37,99,255,.08);padding:6px 14px;border-radius:100px;margin-bottom:20px;}
    .bd-title{font-family:var(--font-d);font-size:clamp(30px,4.2vw,52px);font-weight:800;line-height:1.1;letter-spacing:-.03em;color:var(--black);margin-bottom:20px;}
    .bd-exc{font-size:18px;line-height:1.7;color:#666;margin-bottom:26px;}
    .bd-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:#888;}
    .bd-meta .dot{width:4px;height:4px;border-radius:50%;background:#ccc;}
    .bd-meta strong{color:#333;font-weight:600;}
    .bd-hero{width:100%;height:clamp(260px,42vw,480px);border-radius:24px;overflow:hidden;margin:40px 0;background-size:cover;background-position:center;}

    .bd-layout{display:grid;grid-template-columns:1fr 320px;gap:60px;align-items:start;padding-bottom:96px;}
    .bd-article{min-width:0;}
    .bd-article h2{font-family:var(--font-d);font-size:clamp(24px,2.4vw,30px);font-weight:700;letter-spacing:-.02em;color:var(--black);margin:38px 0 16px;}
    .bd-article h3{font-family:var(--font-d);font-size:20px;font-weight:700;color:var(--black);margin:28px 0 12px;}
    .bd-article p{font-size:16px;line-height:1.85;color:#444;margin-bottom:20px;}
    .bd-article ul{margin:0 0 22px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;}
    .bd-article li{position:relative;padding-left:30px;font-size:15.5px;line-height:1.7;color:#444;}
    .bd-article li::before{content:'';position:absolute;left:4px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--blue);}
    .bd-article strong{color:#1a1a1a;font-weight:700;}
    .bd-quote{background:linear-gradient(135deg,#0d1840,#162050);color:#fff;border-radius:20px;padding:30px 34px;margin:30px 0;}
    .bd-quote p{font-family:var(--font-d);font-size:20px;font-weight:600;line-height:1.5;color:#fff;margin:0;}
    .bd-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px;padding-top:28px;border-top:1px solid rgba(0,0,0,.07);}
    .bd-tag{font-size:12.5px;font-weight:600;color:#555;border:1px solid rgba(0,0,0,.12);padding:7px 16px;border-radius:100px;}

    .bd-side{position:sticky;top:90px;display:flex;flex-direction:column;gap:24px;}
    .side-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:22px;padding:26px;}
    .side-h{font-family:var(--font-d);font-size:16px;font-weight:700;margin-bottom:6px;}
    .pp{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(0,0,0,.06);}
    .pp:last-child{border-bottom:none;padding-bottom:0;}
    .pp-thumb{width:62px;height:62px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
    .pp-thumb svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .pp-cat{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:5px;display:block;}
    .pp-t{font-family:var(--font-d);font-size:13.5px;font-weight:700;line-height:1.35;color:#1a1a1a;transition:color .2s;}
    .pp:hover .pp-t{color:var(--blue);}
    .side-cta{background:linear-gradient(140deg,#0d1840,#162050);border-radius:22px;padding:28px;color:#fff;}
    .side-cta-h{font-family:var(--font-d);font-size:18px;font-weight:700;line-height:1.3;margin-bottom:10px;}
    .side-cta-p{font-size:13px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:20px;}
    .side-cta-btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;padding:12px 24px;border-radius:100px;font-family:var(--font-d);font-size:13.5px;font-weight:700;transition:all .3s;}
    .side-cta-btn:hover{background:var(--blue-dark);transform:translateY(-2px);}

    /* --- Related Posts Section (More from Our Data Lab) --- */
    .sec-rel{padding:80px 80px 96px;background:#f8f9fb;border-top:1px solid rgba(0,0,0,.06);}
    .rel-h{font-family:var(--font-d);font-size:clamp(28px,3.2vw,40px);font-weight:700;letter-spacing:-.02em;margin-bottom:44px;}
    .rel-h em{font-style:italic;color:var(--blue);}
    .rel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}

    .rel-card {
      background:#fff;
      border:1px solid rgba(0,0,0,.06);
      border-radius:16px;
      overflow:hidden;
      transition:all .35s cubic-bezier(.16,1,.3,1);
      display:block;
      text-decoration:none;
    }
    .rel-card:hover {
      transform:translateY(-6px);
      box-shadow:0 20px 50px rgba(0,0,0,.08);
      border-color:rgba(37,99,255,.15);
    }
    .rel-card-image{height:180px;background-size:cover;background-position:center;position:relative;}
    .rel-card-body{padding:24px 24px 28px;}
    .rel-cat{
      font-size:10px;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--blue);
      display:block;
      margin-bottom:12px;
    }
    .rel-title{
      font-family:var(--font-d);
      font-size:17px;
      font-weight:700;
      color:#0a0a0a;
      line-height:1.35;
      margin-bottom:10px;
    }
    .rel-exc{
      font-size:13.5px;
      color:#666;
      line-height:1.7;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .blog-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:22px;overflow:hidden;transition:all .35s cubic-bezier(.16,1,.3,1);display:block;}
    .blog-card:hover{transform:translateY(-7px);box-shadow:0 22px 60px rgba(0,0,0,.1);border-color:rgba(37,99,255,.18);}
    .blog-art{height:170px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .blog-art-ico{width:64px;height:64px;border:1.5px solid rgba(255,255,255,.28);border-radius:18px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;}
    .blog-art-ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .blog-body{padding:24px;}
    .blog-cat{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:9px;display:block;}
    .blog-title{font-family:var(--font-d);font-size:17px;font-weight:700;color:#0a0a0a;line-height:1.35;margin-bottom:11px;}
    .blog-exc{font-size:13px;color:#666;line-height:1.7;margin-bottom:18px;}
    .blog-foot{display:flex;align-items:center;justify-content:space-between;padding-top:15px;border-top:1px solid rgba(0,0,0,.06);}
    .blog-date{font-size:11px;color:#bbb;}
    .blog-read{font-size:13px;font-weight:600;color:var(--blue);display:inline-flex;align-items:center;gap:6px;}
    .blog-read svg{width:13px;height:13px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;}

    .metband{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:0 0 12px;}
    .metband .met{background:#f8f9fb;border:1px solid rgba(0,0,0,.07);border-radius:18px;padding:26px 24px;text-align:center;}
    .metband .metv{font-family:var(--font-d);font-size:clamp(26px,3vw,38px);font-weight:800;color:var(--blue);line-height:1;letter-spacing:-.02em;}
    .metband .metl{font-size:13px;color:#666;margin-top:9px;}
    .bd-missing{max-width:600px;margin:0 auto;text-align:center;padding:40px 0 80px;}
    .bd-missing h1{font-family:var(--font-d);font-size:30px;font-weight:800;margin-bottom:14px;}
    .bd-missing p{color:#666;margin-bottom:26px;}

    .footer-mini{text-align:center;padding:28px;font-size:13px;color:#aaa;border-top:1px solid rgba(0,0,0,.06);}

    @media(max-width:980px){.bd-layout{grid-template-columns:1fr;gap:48px;}.bd-side{position:static;}.rel-grid{grid-template-columns:1fr 1fr;}}
    @media(max-width:900px){.nav{padding:0 24px;}.bd-shell{padding:96px 24px 0;}.sec-rel{padding:60px 24px;}.metband{grid-template-columns:1fr;}}
    @media(max-width:600px){.rel-grid{grid-template-columns:1fr;}.rel-card-body{padding:20px 20px 24px;}.rel-title{font-size:16px;}}
  
    /* ---- FULL NAV OVERRIDE ---- */
    .nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:70px;padding:0 60px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.06);transition:all .4s;}
    .nav.dark{background:#0a0a0a;border-bottom-color:rgba(255,255,255,.08);}
    .nav.dark .nl a{color:rgba(255,255,255,.85);}
    .nav.dark .nl a:hover{color:#fff;}
    .nav.dark .nav-toggle span{background:#fff;}
    .nav-logo img{height:40px;}
    .nl{display:flex;align-items:center;gap:36px;list-style:none;margin:0;padding:0;}
    .nl a{font-size:14px;font-weight:500;color:rgba(0,0,0,.7);transition:color .25s;position:relative;}
    .nl a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1.5px;background:var(--blue);transition:width .3s;}
    .nl a:hover::after{width:100%;}
    .nl a:hover{color:var(--blue);}
    .nav-cta{background:var(--blue);color:#fff !important;padding:10px 22px;border-radius:100px;font-size:14px;font-weight:600;transition:all .25s;}
    .nav-cta:hover{background:var(--blue-dark);box-shadow:0 6px 20px rgba(37,99,255,.4);transform:translateY(-1px);}
    .nav-cta::after{display:none !important;}
    .nl .has-drop{position:relative;}
    .nl .has-drop>a::after{display:none;}
    .nl .has-drop>a{cursor:pointer;}
    .nl .has-drop>a span{display:inline-block;transition:transform .25s;}
    .nl .has-drop.open>a span{transform:rotate(180deg);}
    .nav-drop{display:none;flex-direction:column;gap:2px;position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.12);padding:10px;min-width:230px;z-index:200;}
    .nav-menu{color:#333 !important;}
    .has-drop.open>.nav-drop{display:flex;}
    .nav-drop a{display:block;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;color:#333;white-space:nowrap;transition:background .18s,color .18s;}
    .nav-drop a:hover{background:#f0f4ff;color:var(--blue);}
    .nav-drop a::after{display:none !important;}
    .nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;background:none;border:none;cursor:pointer;padding:0;z-index:1100;}
    .nav-toggle span{display:block;width:24px;height:2px;background:var(--black);border-radius:2px;transition:transform .3s,opacity .3s;}
    .nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .nav-open .nav-toggle span:nth-child(2){opacity:0;}
    .nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
    /* ---- FOOTER ---- */
    .footer{background:#050508;color:#fff;padding:72px 80px 36px;}
    .ft{display:grid;grid-template-columns:2.5fr 1fr 1.5fr 1fr 1fr;gap:44px;padding-bottom:56px;border-bottom:1px solid rgba(255,255,255,.06);}
    .fb-desc{font-size:14px;line-height:1.7;color:rgba(255,255,255,.65);max-width:250px;margin:18px 0 26px;}
    .socials{display:flex;gap:10px;}
    .soc{width:36px;height:36px;border:1px solid rgba(255,255,255,.1);border-radius:7px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);transition:all .3s;}
    .soc:hover{border-color:var(--blue);background:rgba(37,99,255,.15);color:#fff;transform:translateY(-2px);}
    .fc h4{font-family:var(--font-d);font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:18px;}
    .fl{display:flex;flex-direction:column;gap:11px;}
    .fl a{font-size:14px;color:rgba(255,255,255,.85);transition:color .25s;}
    .fl a:hover{color:#fff;}
    .fbot{display:flex;align-items:center;justify-content:space-between;padding-top:30px;flex-wrap:wrap;gap:12px;}
    .fcopy{font-size:13px;color:rgba(255,255,255,.5);}
    .fleg{display:flex;gap:22px;flex-wrap:wrap;}
    .fleg a{font-size:13px;color:rgba(255,255,255,.5);transition:color .25s;}
    .fleg a:hover{color:rgba(255,255,255,.75);}
    .fdisclaim{font-size:11px;color:rgba(255,255,255,.35);text-align:center;margin-top:22px;line-height:1.6;max-width:700px;margin-left:auto;margin-right:auto;}
    /* ---- SCROLL-TO-TOP ---- */
    .stb{position:fixed;bottom:32px;right:32px;width:46px;height:46px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;cursor:pointer;z-index:500;opacity:0;transform:translateY(16px);transition:all .3s;box-shadow:0 6px 20px rgba(37,99,255,.4);}
    .stb.on{opacity:1;transform:none;}
    .stb:hover{background:var(--blue-dark);transform:translateY(-3px);}
    @media(max-width:768px){
      .nav{padding:0 22px;}
      .nav-toggle{display:flex;}
      .nl{position:fixed;top:70px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:#fff;padding:10px 22px 22px;border-bottom:1px solid rgba(0,0,0,.08);box-shadow:0 24px 44px rgba(0,0,0,.13);max-height:calc(100vh - 70px);overflow-y:auto;transform:translateY(-14px);opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility .3s;}
      .nav-open .nl{transform:translateY(0);opacity:1;visibility:visible;}
      .nl li{width:100%;}
      .nl>li>a{display:block;padding:14px 6px;font-size:16px;border-bottom:1px solid rgba(0,0,0,.06);}
      .nl a::after{display:none !important;}
      .nl .has-drop>a span{float:right;}
      .nav-drop{position:static;transform:none;box-shadow:none;border:none;background:transparent;padding:2px 0 10px 14px;min-width:0;}
      .nav-drop a{font-size:14px;padding:9px 8px;color:#555;}
      .nl .nav-cta{display:block;text-align:center;margin-top:16px;}
      .ft{grid-template-columns:1fr 1fr;}
      .footer{padding:60px 24px;}
    }
  
    /* ==== CUSTOM CURSOR ==== */
    body { cursor: none; }
    .cur-dot {
      width: 8px; height: 8px; background: var(--blue);
      border-radius: 50%; position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%); transition: width .15s, height .15s;
    }
    .cur-ring {
      width: 36px; height: 36px; border: 1.5px solid var(--blue);
      border-radius: 50%; position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%); transition: width .1s, height .1s, opacity .1s;
    }
    
    /* ---- TABLE STYLING ---- */
    .table-container {
      width: 100%;
      overflow-x: auto;
      margin: 30px 0;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.01);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14.5px;
      background: #fff;
    }
    th, td {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    th {
      font-family: var(--font-d);
      font-weight: 700;
      color: var(--black);
      background: #f8f9fb;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:nth-child(even) {
      background: #fbfcfe;
    }
    tr:hover {
      background: rgba(37, 99, 255, 0.02);
    }
    
    /* ---- FAQ ACCORDION STYLING ---- */
    .faq-accordion {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .faq-item {
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      background: #fdfdfd;
      overflow: hidden;
      transition: all 0.3s ease;
    }

  navy: 'linear-gradient(135deg,#0d1840 0%,#162050 60%,#2563FF 100%)'

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function inline(s) {
  // First, extract and save HTML links
  var links = [];
  var out = String(s || '');
  
  // Temporarily replace HTML links with placeholders
  out = out.replace(/<a\s+[^>]*>.*?<\/a>/gi, function(match) {
    links.push(match);
    return '###LINK' + (links.length - 1) + '###';
  });
  
  // Now escape the remaining text (but NOT the placeholders)
  out = out
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  
  // Apply bold formatting
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  
  // Convert markdown links [text](url) to HTML
  out = out.replace(/\[(.+?)\]\((\/[^\s)]+|https?:\/\/[^\s)]+)\)/g, '<a href="$2">$1</a>');
  
  // Restore the HTML links
  out = out.replace(/###LINK(\d+)###/g, function(match, index) {
    return links[parseInt(index)];
  });
  
  return out;
}
function getGradient(post) {
  return GRADIENTS[post.gradient] || GRADIENTS.blue;
}

function getIcon(post) {
  return ICONS[post.icon] || ICONS.database;
}

function getPostUrl(slug) {

function parseTableRow(rowLine) {
  var cells = rowLine.split('|');
  if (rowLine.indexOf('|') === 0) {
    cells.shift();
  }
  if (rowLine.lastIndexOf('|') === rowLine.length - 1 && rowLine.length > 1) {
    cells.pop();
  }
  return cells.map(function(c) { return c.trim(); });
}

function renderTable(tableLines) {
  if (tableLines[0] && tableLines[0].indexOf('Product A') === 0 && tableLines[0].split('|').length === 6) {
    tableLines.unshift('Product | Marketplace | Date | Seller | Price | Availability');
    tableLines.splice(1, 0, '---|---|---|---|---|---');
  }
  
  var dividerIndex = -1;
  for (var j = 0; j < tableLines.length; j++) {
    var cleanLine = tableLines[j].trim();
    if (/^[|:\-\s]+$/.test(cleanLine) && cleanLine.indexOf('-') !== -1) {
      dividerIndex = j;
      break;
    }
  }
  
  var html = '<div class="table-container"><table>';
  var headerRows = [];
  var bodyRows = [];
  
  if (dividerIndex !== -1) {
    headerRows = tableLines.slice(0, dividerIndex);
    bodyRows = tableLines.slice(dividerIndex + 1);
  } else {
    headerRows = [tableLines[0]];
    bodyRows = tableLines.slice(1);
  }
  
  if (headerRows.length > 0) {
    html += '<thead>';
    headerRows.forEach(function(rowLine) {
      html += '<tr>';
      var cells = parseTableRow(rowLine);
      cells.forEach(function(cell) {
        html += '<th>' + escapeHtml(cell) + '</th>';
      });
      html += '</tr>';
    });
    html += '</thead>';
  }
  
  if (bodyRows.length > 0) {
    html += '<tbody>';
    bodyRows.forEach(function(rowLine) {
      html += '<tr>';
      var cells = parseTableRow(rowLine);
      cells.forEach(function(cell) {
        html += '<td>' + escapeHtml(cell) + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody>';
  }
  
  html += '</table></div>';
  return html;
}

function injectFaqSchema(faqs) {
  if (!faqs || faqs.length === 0) return;
  var existingSchema = document.getElementById('faq-schema-markup');
  if (existingSchema) {
    existingSchema.remove();
  }
  
  var schema = {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": faqs.map(function(faq) {
      return {
        "@type": "Question",
        "name": faq.q,
        "acceptedAnswer": {
          "@type": "Answer",
          "text": faq.a
        }
      };
    })
  };
  
  var script = document.createElement('script');
  script.id = 'faq-schema-markup';
  script.type = 'application/ld+json';
  script.text = JSON.stringify(schema);
  document.head.appendChild(script);
}

function toggleFaq(btn) {
  var item = btn.parentElement;
  var isOpen = item.classList.contains('open');
  
  var allItems = document.querySelectorAll('.faq-item');
  allItems.forEach(function(i) {
    i.classList.remove('open');
    var ans = i.querySelector('.faq-answer');
    if (ans) ans.style.maxHeight = null;
  });
  
  if (!isOpen) {
    item.classList.add('open');
    var answer = item.querySelector('.faq-answer');
    if (answer) {
      answer.style.maxHeight = answer.scrollHeight + 'px';
    }
  }
}

function renderBody(md) {
  var lines = String(md || '').split(/\r?\n/);

  function closeList() { if (listOpen) { html += '</ul>'; listOpen = false; } }

  var faqs = [];
  var tempInFaq = false;
  var currentQuestion = null;
  var currentAnswer = [];

  for (var j = 0; j < lines.length; j++) {
    var l = lines[j].trim();
    if (l.indexOf('## ') === 0 && l.toLowerCase().indexOf('faq') !== -1) {
      tempInFaq = true;
      continue;
    }
    if (tempInFaq) {
      if (l.indexOf('## ') === 0 || l.indexOf('### ') === 0) {
        if (currentQuestion && currentAnswer.length > 0) {
          faqs.push({ q: currentQuestion, a: currentAnswer.join(' ') });
        }
        tempInFaq = false;
        continue;
      }
      if (l.indexOf('**') === 0 && l.lastIndexOf('**') === l.length - 2 && l.length > 4) {
        if (currentQuestion && currentAnswer.length > 0) {
          faqs.push({ q: currentQuestion, a: currentAnswer.join(' ') });
        }
        currentQuestion = l.slice(2, -2).trim();
        currentAnswer = [];
      } else if (l) {
        if (currentQuestion) {
          currentAnswer.push(l);
        }
      }
    }
  }
  if (currentQuestion && currentAnswer.length > 0) {
    faqs.push({ q: currentQuestion, a: currentAnswer.join(' ') });
  }

  injectFaqSchema(faqs);

  var inFaqSection = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    
    // Skip empty lines
    if (!line) {
      closeList();
      continue;
    }
    
    // Check if this line starts with an HTML link (already processed)
    var isHtmlLink = line.indexOf('<a ') === 0 || line.indexOf('</a>') !== -1;
    
    if (line.indexOf('## ') === 0 && line.toLowerCase().indexOf('faq') !== -1) {
      closeList();
      inFaqSection = true;
      html += '<h2>' + inline(line.slice(3)) + '</h2>';
      html += '<div class="faq-accordion">';
      faqs.forEach(function(faq) {
        html += '<div class="faq-item">';
        html += '<button class="faq-question" onclick="toggleFaq(this)">';
        html += '<span>' + faq.q + '</span>';
        html += '<span class="faq-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>';
        html += '</button>';
        html += '<div class="faq-answer">';
        html += '<p>' + faq.a + '</p>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
      continue;
    }
    
    if (inFaqSection) {
      if (line.indexOf('## ') === 0 || line.indexOf('### ') === 0) {
        inFaqSection = false;
      } else {
        continue;
      }
    }

    if (line.indexOf('|') !== -1) {
      closeList();
      var tableLines = [];
      while (i < lines.length && lines[i].trim().indexOf('|') !== -1) {
        tableLines.push(lines[i].trim());
        i++;
      }
      i--;
      html += renderTable(tableLines);
      continue;
    }

    // Check if this is an HTML link line
    if (line.indexOf('<a ') === 0) {
      closeList();
      html += '<p>' + line + '</p>';
      continue;
    }

    if (line.indexOf('## ') === 0) { 
      closeList(); 
      html += '<h2>' + inline(line.slice(3)) + '</h2>'; 
    }
    else if (line.indexOf('### ') === 0) { 
      closeList(); 
      html += '<h3>' + inline(line.slice(4)) + '</h3>'; 
    }
    else if (line.indexOf('> ') === 0) { 
      closeList(); 
      html += '<blockquote class="bd-quote"><p>' + inline(line.slice(2)) + '</p></blockquote>'; 
    }
    else if (line.indexOf('- ') === 0) { 
      if (!listOpen) { 
        html += '<ul>'; 
        listOpen = true; 
      } 
      html += '<li>' + inline(line.slice(2)) + '</li>'; 
    }
    else { 
      closeList(); 
      html += '<p>' + inline(line) + '</p>'; 
    }
  }
  closeList();
  return html;
}

      document.getElementById('postRoot').innerHTML =
        '<div class="bd-missing"><h1>Article not found</h1>' +
        '<p>This post may have been removed or the link is incorrect.</p>' +
        '<a href="/#contact" class="side-cta-btn" style="background:var(--blue);">Browse all articles →</a></div>';
      return;
    }

    var pageTitle = (post.metaTitle && post.metaTitle.trim()) ? post.metaTitle.trim() : post.title;
    var pageDesc  = (post.metaDescription && post.metaDescription.trim()) ? post.metaDescription.trim() : (post.excerpt || '');

    document.title = pageTitle;

    var metaDescEl = document.querySelector('meta[name="description"]');
    if (metaDescEl) metaDescEl.setAttribute('content', pageDesc);

    var ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute('content', pageTitle);

    var ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc) ogDesc.setAttribute('content', pageDesc);

    var canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical) {
      canonical = document.createElement('link');
      canonical.setAttribute('rel', 'canonical');
      document.head.appendChild(canonical);
    }
    canonical.setAttribute('href', 'https://techdataseeders.com/blog/' + post.slug + '/');

    var meta = '<span>By <strong>' + escapeHtml(post.author || 'Techdataseeders') + '</strong></span>';
    if (post.date) { meta += '<span class="dot"></span><span>' + escapeHtml(post.date) + '</span>'; }
    if (post.readTime) { meta += '<span class="dot"></span><span>' + escapeHtml(post.readTime) + '</span>'; }

    var tags = (post.tags || []).map(function(t) { return '<span class="bd-tag">' + escapeHtml(t) + '</span>'; }).join('');

    var popular = others.slice(0, 3).map(popHTML).join('') ||
                  '<p style="font-size:13px;color:#999;">No other posts yet.</p>';

    document.getElementById('postRoot').innerHTML =
      '<div class="bd-crumb">' +
        '<a href="/blog/" class="bd-back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back to Blog</a>' +
        '<nav class="bd-bread"><a href="/">Home</a><span class="sep">/</span>' +
        '<a href="/blog/">Blog</a><span class="sep">/</span>' +
        '<span class="current">' + escapeHtml(post.category || 'Article') + '</span></nav>' +
      '</div>' +
      '<div class="bd-head">' +
        '<span class="bd-cat">' + escapeHtml(post.category || 'Article') + '</span>' +
        '<h1 class="bd-title">' + escapeHtml(post.title) + '</h1>' +
        (post.excerpt ? '<p class="bd-exc">' + escapeHtml(post.excerpt) + '</p>' : '') +
        '<div class="bd-meta">' + meta + '</div>' +
      '</div>' +
      (post.heroImage ? '<div class="bd-hero" style="background-image:url(\'' + escapeHtml(post.heroImage) + '\');"></div>' : '<div style="height:40px;"></div>') +
      (post.metrics && post.metrics.length ? '<div class="metband">' + post.metrics.map(function(m) { return '<div class="met"><div class="metv">' + escapeHtml(m.value) + '</div><div class="metl">' + escapeHtml(m.label) + '</div></div>'; }).join('') + '</div>' : '') +
      '<div class="bd-layout">' +
        '<article class="bd-article">' + renderBody(post.body) +
          (tags ? '<div class="bd-tags">' + tags + '</div>' : '') +
        '</article>' +
        '<aside class="bd-side">' +
          '<div class="side-card"><div class="side-h">Popular Posts</div>' + popular + '</div>' +
          '<div class="side-cta"><div class="side-cta-h">Need data like this?</div>' +
          '<div class="side-cta-p">Tell us your requirements and we\'ll send a tailored proposal within 24 hours.</div>' +
          '<a href="/#contact" class="side-cta-btn">Get a Quote →</a></div>' +
        '</aside>' +
      '</div>';

    // Related posts
    var postTags = post.tags || [];
    var scored = others.map(function(p) {
      var score = 0;
      if (p.category === post.category) score += 3;
      (p.tags || []).forEach(function(t) {
        if (postTags.indexOf(t) !== -1) score += 1;
      });
      return { post: p, score: score };
    });
    scored.sort(function(a, b) { return b.score - a.score; });
    var rel = scored.slice(0, 3).map(function(s) { return s.post; });

    if (rel.length) {
      document.getElementById('relGrid').innerHTML = rel.map(createRelatedCardHTML).join('');
      document.getElementById('relSection').style.display = '';
    }
    window.scrollTo(0, 0);
  });
})();
</script>

        isHidden = false;
      }
    }
    
    lastScrollY = currentScrollY;
  });

  <!-- Dynamic Component Loader Script -->
  <script>
  function includeComponent(id, url, callback) {
    const element = document.getElementById(id);
    if (!element) return;
    fetch(url)
      .then(response => response.text())
      .then(data => {
        element.innerHTML = data;
        if (callback) callback();
      })
      .catch(error => console.warn(`Failed to load component ${url}:`, error));
  }

  function initNavbar() {
    const nav = document.getElementById('nav');
    const toggle = document.getElementById('navToggle');
    if (!nav) return;
    
    const drops = nav.querySelectorAll('.nl .has-drop');
    function closeDrops(except) {
      drops.forEach(function(li) {
        if (li !== except) li.classList.remove('open');
      });
    }

    drops.forEach(function(li) {
      const link = li.querySelector(':scope > a');
      if (link) {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const willOpen = !li.classList.contains('open');
          closeDrops(li);
          li.classList.toggle('open', willOpen);
        });
      }
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.has-drop')) closeDrops(null);
    });

    if (toggle) {
      toggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const open = nav.classList.toggle('nav-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        if (!open) closeDrops(null);
      });
    }

    nav.querySelectorAll('.nl a').forEach(function(a) {
      if (a.parentElement && a.parentElement.classList.contains('has-drop')) return;
      a.addEventListener('click', function() {
        nav.classList.remove('nav-open');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
        closeDrops(null);
      });
    });

    window.addEventListener('scroll', function() {
      const navLogo = document.getElementById('navLogo');
      const s = window.scrollY;
      nav.classList.toggle('dark', s > 80);
      if (navLogo) {
        navLogo.src = s > 80 ? '/logo/TDS Logo Set/Tech DataSeeders Logo white.png' : '/logo/Tech DataSeeders Logo.png';
      }
    });
  }

  includeComponent('navbar-placeholder', '/components/navbar.html', initNavbar);
  includeComponent('footer-placeholder', '/components/footer.html');
  </script>
