  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2563FF;
      --blue-dark: #1a4fd8;
      --black: #0a0a0a;
      --font-d: 'Plus Jakarta Sans', sans-serif;
      --font-b: 'Inter', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-b);
      background: #06091a;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      cursor: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { text-decoration: none; color: inherit; }

    /* ---- CUSTOM CURSOR ---- */
    .cur-dot {
      width: 8px; height: 8px;
      background: var(--blue);
      border-radius: 50%; position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .15s, height .15s;
    }
    .cur-ring {
      width: 36px; height: 36px;
      border: 1.5px solid var(--blue);
      border-radius: 50%; position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width .1s, height .1s, opacity .1s;
    }

    /* ---- NAV ---- */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      height: 70px; padding: 0 60px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,.96); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      transition: all .4s;
    }
    .nav.dark { background: #0a0a0a; border-bottom-color: rgba(255,255,255,.08); }
    .nav.dark .nl a { color: rgba(255,255,255,.85); }
    .nav.dark .nl a:hover { color: #fff; }
    .nav.dark .nav-toggle span { background: #fff; }
    .nav-logo img { height: 40px; }
    .nl { display: flex; align-items: center; gap: 36px; list-style: none; }
    .nl a { font-size: 14px; font-weight: 500; color: rgba(0,0,0,.7); transition: color .25s; position: relative; }
    .nl a::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1.5px; background: var(--blue); transition: width .3s; }
    .nl a:hover::after { width: 100%; }
    .nl a:hover { color: var(--blue); }
    .nav-cta { background: var(--blue); color: #fff !important; padding: 10px 22px; border-radius: 100px; font-size: 14px; font-weight: 600; transition: all .25s; }
    .nav-cta:hover { background: var(--blue-dark); box-shadow: 0 6px 20px rgba(37,99,255,.4); transform: translateY(-1px); }
    .nav-cta::after { display: none !important; }
    .nl .has-drop { position: relative; }
    .nl .has-drop > a::after { display: none; }
    .nl .has-drop > a { cursor: pointer; }
    .nl .has-drop > a span { display: inline-block; transition: transform .25s; }
    .nl .has-drop.open > a span { transform: rotate(180deg); }
    .nav-drop { display: none; flex-direction: column; gap: 2px; position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid rgba(0,0,0,.08); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.12); padding: 10px; min-width: 230px; z-index: 200; }
    .nav-menu { color: #333 !important; }
    .has-drop.open > .nav-drop { display: flex; }
    .nav-drop a { display: block; padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #333; white-space: nowrap; transition: background .18s, color .18s; }
    .nav-drop a:hover { background: #f0f4ff; color: var(--blue); }
    .nav-drop a::after { display: none !important; }
    .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 42px; height: 42px; background: none; border: none; cursor: pointer; padding: 0; z-index: 1100; }
    .nav-toggle span { display: block; width: 24px; height: 2px; background: var(--black); border-radius: 2px; transition: transform .3s, opacity .3s; }
    .nav-open .nav-toggle span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
    .nav-open .nav-toggle span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ---- HERO ---- */
    .ty-hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 110px 40px 80px;
      background: linear-gradient(150deg, #06091a 0%, #0d1840 60%, #162050 100%);
      position: relative;
      overflow: hidden;
    }

    /* Background decorative blobs */
    .ty-hero::before {
      content: '';
      position: absolute;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(37,99,255,0.12) 0%, transparent 70%);
      top: -150px; right: -150px;
      border-radius: 50%;
      pointer-events: none;
    }
    .ty-hero::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(37,99,255,0.08) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .ty-card {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 620px;
      width: 100%;
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- CHECKMARK ICON ---- */
    .ty-icon-wrap {
      width: 100px; height: 100px;
      margin: 0 auto 36px;
      position: relative;
    }
    .ty-icon-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(37, 99, 255, 0.12);
      animation: pulseRing 2.5s ease-in-out infinite;
    }
    .ty-icon-ring-2 {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: rgba(37, 99, 255, 0.05);
      animation: pulseRing 2.5s ease-in-out 0.4s infinite;
    }
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.6; }
    }
    .ty-icon-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a4fd8 0%, #2563FF 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(37, 99, 255, 0.45);
    }
    .ty-check {
      width: 48px; height: 48px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawCheck 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* ---- TEXT ---- */
    .ty-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--blue);
      background: rgba(37, 99, 255, 0.12);
      padding: 6px 16px;
      border-radius: 100px;
      margin-bottom: 22px;
    }

    .ty-h1 {
      font-family: var(--font-d);
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 20px;
    }
    .ty-h1 .accent {
      background: linear-gradient(90deg, #60a5fa, #2563FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .ty-sub {
      font-size: 17px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 44px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---- COUNTDOWN ---- */
    .ty-countdown-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 40px;
    }
    .ty-countdown-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      overflow: hidden;
    }
    .ty-countdown-bar {
      height: 100%;
      background: linear-gradient(90deg, #2563FF, #60a5fa);
      border-radius: 100px;
      width: 100%;
      transform-origin: left;
      animation: shrinkBar 3s linear forwards;
    }
    @keyframes shrinkBar {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }
    .ty-countdown-text {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }
    .ty-countdown-text strong {
      color: rgba(255, 255, 255, 0.85);
      font-variant-numeric: tabular-nums;
    }

    /* ---- BUTTONS ---- */
    .ty-actions {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ty-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue);
      color: #fff;
      padding: 14px 28px;
      border-radius: 100px;
      font-family: var(--font-d);
      font-size: 15px;
      font-weight: 700;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ty-btn-primary:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(37, 99, 255, 0.5);
    }
    .ty-btn-primary svg {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
      transition: transform .25s;
    }
    .ty-btn-primary:hover svg { transform: translateX(3px); }

    .ty-btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.7);
      padding: 14px 24px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 14px;
      font-weight: 500;
      transition: all .25s;
    }
    .ty-btn-ghost:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.06);
    }

    /* ---- STATS STRIP ---- */
    .ty-stats {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-top: 64px;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 40px;
    }
    .ty-stat {
      padding: 0 36px;
      text-align: center;
      position: relative;
    }
    .ty-stat + .ty-stat::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10%;
      height: 80%;
      width: 1px;
      background: rgba(255,255,255,0.08);
    }
    .ty-stat-val {
      font-family: var(--font-d);
      font-size: clamp(24px, 3vw, 32px);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 6px;
    }
    .ty-stat-val span {
      background: linear-gradient(90deg, #60a5fa, #2563FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .ty-stat-lbl {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }

    /* ---- FOOTER ---- */
    .footer { background: #050508; color: #fff; padding: 72px 80px 36px; }
    .ft { display: grid; grid-template-columns: 2.5fr 1fr 1.5fr 1fr 1fr; gap: 44px; padding-bottom: 56px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .fb-desc { font-size: 14px; line-height: 1.7; color: rgba(255,255,255,.65); max-width: 250px; margin: 18px 0 26px; }
    .socials { display: flex; gap: 10px; }
    .soc { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,.1); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.45); transition: all .3s; }
    .soc:hover { border-color: var(--blue); background: rgba(37,99,255,.15); color: #fff; transform: translateY(-2px); }
    .fc h4 { font-family: var(--font-d); font-size: 12px; font-weight: 700; color: rgba(255,255,255,.4); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 18px; }
    .fl { display: flex; flex-direction: column; gap: 11px; }
    .fl a { font-size: 14px; color: rgba(255,255,255,.85); transition: color .25s; }
    .fl a:hover { color: #fff; }
    .fbot { display: flex; align-items: center; justify-content: space-between; padding-top: 30px; flex-wrap: wrap; gap: 12px; }
    .fcopy { font-size: 13px; color: rgba(255,255,255,.5); }
    .fleg { display: flex; gap: 22px; flex-wrap: wrap; }
    .fleg a { font-size: 13px; color: rgba(255,255,255,.5); transition: color .25s; }
    .fleg a:hover { color: rgba(255,255,255,.75); }
    .fdisclaim { font-size: 11px; color: rgba(255,255,255,.35); text-align: center; margin-top: 22px; line-height: 1.6; max-width: 700px; margin-left: auto; margin-right: auto; }

    /* ---- SCROLL TO TOP ---- */
    .stb { position: fixed; bottom: 32px; right: 32px; width: 46px; height: 46px; background: var(--blue); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; cursor: pointer; z-index: 500; opacity: 0; transform: translateY(16px); transition: all .3s; box-shadow: 0 6px 20px rgba(37,99,255,.4); }
    .stb.on { opacity: 1; transform: none; }
    .stb:hover { background: var(--blue-dark); transform: translateY(-3px); }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 768px) {
      .nav { padding: 0 22px; }
      .nav-toggle { display: flex; }
      .nl { position: fixed; top: 70px; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; background: #fff; padding: 10px 22px 22px; border-bottom: 1px solid rgba(0,0,0,.08); box-shadow: 0 24px 44px rgba(0,0,0,.13); max-height: calc(100vh - 70px); overflow-y: auto; transform: translateY(-14px); opacity: 0; visibility: hidden; transition: transform .3s, opacity .3s, visibility .3s; }
      .nav-open .nl { transform: translateY(0); opacity: 1; visibility: visible; }
      .nl li { width: 100%; }
      .nl > li > a { display: block; padding: 14px 6px; font-size: 16px; border-bottom: 1px solid rgba(0,0,0,.06); }
      .nl a::after { display: none !important; }
      .nl .has-drop > a span { float: right; }
      .nav-drop { position: static; transform: none; box-shadow: none; border: none; background: transparent; padding: 2px 0 10px 14px; min-width: 0; }
      .nav-drop a { font-size: 14px; padding: 9px 8px; color: #555; }
      .nl .nav-cta { display: block; text-align: center; margin-top: 16px; }
      .ty-hero { padding: 90px 24px 60px; }
      .ty-icon-wrap { width: 80px; height: 80px; margin-bottom: 28px; }
      .ty-check { width: 38px; height: 38px; }
      .ty-stats { flex-direction: column; gap: 24px; align-items: center; }
      .ty-stat + .ty-stat::before { display: none; }
      .footer { padding: 60px 24px; }
      .ft { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 480px) {
      .ty-actions { flex-direction: column; align-items: stretch; }
      .ty-btn-primary, .ty-btn-ghost { justify-content: center; }
      .ty-stat { padding: 0 20px; }
    }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KHKDNZLD"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<!-- Custom Cursor -->
<div class="cur-dot" id="cd"></div>
<div class="cur-ring" id="cr"></div>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<!-- ======================== THANK YOU HERO ======================== -->
<main class="ty-hero">
  <div class="ty-card">

    <!-- Check icon -->
    <div class="ty-icon-wrap">
      <div class="ty-icon-ring-2"></div>
      <div class="ty-icon-ring"></div>
      <div class="ty-icon-inner">
        <svg class="ty-check" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>

    <!-- Label pill -->
    <span class="ty-label">Message Received</span>

    <!-- Heading -->
    <h1 class="ty-h1">Thank <span class="accent">You!</span></h1>

    <!-- Subheading -->
    <p class="ty-sub">
      We've received your message and our team will get back to you
      within <strong style="color:rgba(255,255,255,.85);">24 hours</strong>.
      We're excited to learn more about your data needs.
    </p>

    <!-- Countdown bar -->
    <div class="ty-countdown-wrap">
      <div class="ty-countdown-track">
        <div class="ty-countdown-bar"></div>
      </div>
      <p class="ty-countdown-text">Redirecting in <strong id="countNum">3</strong>s&hellip;</p>
    </div>

    <!-- Action buttons -->
    <div class="ty-actions">
      <a href="/#contact" class="ty-btn-primary" id="backBtn">
        Back to Homepage
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
      <a href="/blog/" class="ty-btn-ghost">
        Explore our Blog
      </a>
    </div>

    <!-- Stats strip -->
    <div class="ty-stats">
      <div class="ty-stat">
        <div class="ty-stat-val"><span>500+</span></div>
        <div class="ty-stat-lbl">Projects Delivered</div>
      </div>
      <div class="ty-stat">
        <div class="ty-stat-val"><span>98%</span></div>
        <div class="ty-stat-lbl">Client Satisfaction</div>
      </div>
      <div class="ty-stat">
        <div class="ty-stat-val"><span>24h</span></div>
        <div class="ty-stat-lbl">Response Time</div>
      </div>
    </div>

  </div>
</main>

<!-- Footer -->
<div id="footer-placeholder"></div>

<!-- Scroll to top -->
<div class="stb" id="stb" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</div>

<script>
/* ---- COUNTDOWN & REDIRECT ---- */
(function() {
  var count = 3;
  var el = document.getElementById('countNum');
  var timer = setInterval(function() {
    count--;
    if (el) el.textContent = count;
    if (count <= 0) {
      clearInterval(timer);
      window.location.href = '/#contact';
    }
  }, 1000);

  // Cancel auto-redirect if user clicks a button manually
  document.getElementById('backBtn').addEventListener('click', function() {
    clearInterval(timer);
  });
})();

/* ---- CURSOR ---- */
(function() {
  var cd = document.getElementById('cd'), cr = document.getElementById('cr');
  if (!cd || !cr) return;
  var mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', function(e) {
    mx = e.clientX; my = e.clientY;
    cd.style.left = mx + 'px'; cd.style.top = my + 'px';
  });
  (function loop() {
    rx += (mx - rx) * .12; ry += (my - ry) * .12;
    cr.style.left = rx + 'px'; cr.style.top = ry + 'px';
    requestAnimationFrame(loop);
  })();
  document.querySelectorAll('a, button').forEach(function(el) {
    el.addEventListener('mouseenter', function() { cd.style.width = cd.style.height = '12px'; cr.style.width = cr.style.height = '52px'; cr.style.opacity = '.45'; });
    el.addEventListener('mouseleave', function() { cd.style.width = cd.style.height = '8px'; cr.style.width = cr.style.height = '36px'; cr.style.opacity = '1'; });
  });
})();

/* ---- SCROLL TO TOP ---- */
window.addEventListener('scroll', function() {
  document.getElementById('stb').classList.toggle('on', window.scrollY > 300);
});

/* ---- DYNAMIC COMPONENT LOADER ---- */
function includeComponent(id, url, callback) {
  var element = document.getElementById(id);
  if (!element) return;
  fetch(url)
    .then(function(r) { return r.text(); })
    .then(function(data) {
      element.innerHTML = data;
      if (callback) callback();
    })
    .catch(function(e) { console.warn('Failed to load component ' + url + ':', e); });
}

function initNavbar() {
  var nav = document.getElementById('nav');
  var toggle = document.getElementById('navToggle');
  if (!nav) return;

  var drops = nav.querySelectorAll('.nl .has-drop');
  function closeDrops(except) {
    drops.forEach(function(li) { if (li !== except) li.classList.remove('open'); });
  }
  drops.forEach(function(li) {
    var link = li.querySelector(':scope > a');
    if (link) {
      link.addEventListener('click', function(e) {
        e.preventDefault(); e.stopPropagation();
        var willOpen = !li.classList.contains('open');
        closeDrops(li);
        li.classList.toggle('open', willOpen);
      });
    }
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.has-drop')) closeDrops(null);
  });

  if (toggle) {
    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = nav.classList.toggle('nav-open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (!open) closeDrops(null);
    });
  }

  nav.querySelectorAll('.nl a').forEach(function(a) {
    if (a.parentElement && a.parentElement.classList.contains('has-drop')) return;
    a.addEventListener('click', function() {
      nav.classList.remove('nav-open');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
      closeDrops(null);
    });
  });

  window.addEventListener('scroll', function() {
    var navLogo = document.getElementById('navLogo');
    var s = window.scrollY;
    nav.classList.toggle('dark', s > 80);
    if (navLogo) {
      navLogo.src = s > 80
        ? '/logo/TDS Logo Set/Tech DataSeeders Logo white.png'
        : '/logo/Tech DataSeeders Logo.png';
    }
  });
}

includeComponent('navbar-placeholder', '/components/navbar.html', initNavbar);
includeComponent('footer-placeholder', '/components/footer.html');
</script>
